<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="Register.css">
</head>
<body>
<div class="register-container">
    <h2>Create an Account</h2>

    <form class="registerform" action="register.php" method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="text" name="firstname" placeholder="First Name" required>
        <input type="text" name="lastname" placeholder="Last Name" required>
        <input type="tel" name="phone" placeholder="09123456789" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <select name="role" class="role" required>
            <option value="" disabled selected>Select role</option>
            <option value="Admin">Admin</option>
            <option value="Teacher">Teacher</option>
            <option value="Student">Student</option>
        </select>
        <button type="submit">Register</button>
        <p class="login-link">Already have an account? <a href="./index.html">Log In</a></p>
    </form>
</div>
</body>
</html>
